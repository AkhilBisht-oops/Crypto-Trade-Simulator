version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto_sim_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto_user
      POSTGRES_PASSWORD: crypto_pass_123
      POSTGRES_DB: crypto_trading_sim
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crypto_user -d crypto_trading_sim']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crypto_sim_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: crypto_sim_server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://crypto_user:crypto_pass_123@postgres:5432/crypto_trading_sim
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_key_change_in_production
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: production
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: crypto_sim_client
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  pgdata:
  redisdata:
